title: "dimpap / dev notes"
author: "Dimitris Papadimitriou"
description: "Projects, programming notes, and research by Dimitris Papadimitriou."
url: "https://dimpap99.github.io"
baseurl: ""
lang: en
timezone: Europe/Athens
github_username: DimPap99
email_display: "papadimitrioudimitris99 [at] gmail [dot] com"

# A small, self-contained Jekyll site. No external theme or JavaScript required.
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-redirect-from

# Keep existing post URLs working; projects have their own permanent pages.
permalink: /:categories/:year/:month/:day/:title.html
collections:
  projects:
    output: true
    permalink: /projects/:name/
defaults:
  - scope:
      path: ""
    values:
      layout: page
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      section: notes
  - scope:
      path: ""
      type: projects
    values:
      layout: project
      section: projects
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - scripts
  - templates
  - tests
  - .bundle
  - .jekyll-cache
