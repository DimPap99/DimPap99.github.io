<nav class="post-navigation" aria-label="More notes">
  {% if page.previous %}<a href="{{ page.previous.url | relative_url }}"><span class="eyebrow">← Previous</span><span>{{ page.previous.title | escape }}</span></a>{% endif %}
  {% if page.next %}<a class="next-post" href="{{ page.next.url | relative_url }}"><span class="eyebrow">Next →</span><span>{{ page.next.title | escape }}</span></a>{% endif %}
  {% unless page.previous or page.next %}<a href="{{ '/notes/' | relative_url }}">← Back to all notes</a>{% endunless %}
</nav>
