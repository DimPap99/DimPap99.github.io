<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
  {% include head.html %}
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <div class="site-shell">
      <header class="site-header">
        <a class="brand" href="{{ '/' | relative_url }}" aria-label="dimpap home"><span class="brand-prompt" aria-hidden="true">&gt;_</span> dimpap<span class="brand-path"> / dev notes</span></a>
        <nav class="site-nav" aria-label="Main navigation">
          <a href="{{ '/' | relative_url }}"{% if page.section == 'home' %} aria-current="page"{% endif %}>Home</a>
          <a href="{{ '/projects/' | relative_url }}"{% if page.section == 'projects' %} aria-current="page"{% endif %}>Projects</a>
          <a href="{{ '/notes/' | relative_url }}"{% if page.section == 'notes' %} aria-current="page"{% endif %}>Notes</a>
          <a href="{{ '/about/' | relative_url }}"{% if page.section == 'about' %} aria-current="page"{% endif %}>About</a>
        </nav>
      </header>
      <main id="main" tabindex="-1">{{ content }}</main>
      <footer class="site-footer">
        <p>© {{ site.time | date: '%Y' }} {{ site.author | escape }}</p>
        <div class="footer-links">
          <a href="https://github.com/{{ site.github_username | escape }}">GitHub <span aria-hidden="true">↗</span></a>
          <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
        </div>
      </footer>
    </div>
  </body>
</html>
